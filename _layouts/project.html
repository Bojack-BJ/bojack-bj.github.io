---
layout: default
---

<article class="project-page">
  <header class="project-hero">
    <h1>{{ page.title }}</h1>
    {% if page.summary %}
      <p class="project-subtitle">{{ page.summary }}</p>
    {% endif %}
    <p class="project-meta">{{ page.date | date: "%B %Y" }}{% if page.tags %} · {{ page.tags | join: " · " }}{% endif %}</p>
    {% if page.links %}
      <div class="project-links">
        {% for link in page.links %}
          <a class="button" href="{{ link.url }}" target="_blank" rel="noopener">{{ link.label }}</a>
        {% endfor %}
      </div>
    {% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
