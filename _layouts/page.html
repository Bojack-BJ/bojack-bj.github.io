---
layout: default
---

<article class="content-page">
  <header class="page-heading">
    <p class="eyebrow">{{ page.eyebrow | default: "Profile" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.summary %}
      <p class="lede">{{ page.summary }}</p>
    {% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
